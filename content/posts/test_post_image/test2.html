<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Tooltip при наведении на область</title>
    <style>
        /* Контейнер для изображения и оверлеев */
        .container {
            position: relative;
            display: inline-block;
        }

        /* Прозрачный зелёный прямоугольник (здесь задаются фиксированные координаты и размеры) */
        .area {
            position: absolute;
            top: 100px;
            /* отступ сверху от контейнера */
            left: 50px;
            /* отступ слева от контейнера */
            width: 150px;
            height: 100px;
            background-color: rgba(0, 255, 0, 0.3);
            /* зелёный цвет с прозрачностью 30% */
        }

        /* Tooltip, который будет отображаться в фиксированных координатах */
        .tooltip {
            position: absolute;
            left: 220px;
            /* фиксированное расстояние от левого края контейнера */
            top: 50px;
            /* фиксированное расстояние от верхнего края контейнера */
            background-color: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 5px 10px;
            border-radius: 4px;
            display: none;
            /* по умолчанию скрыт */
        }

        /* При наведении на область (.area) показываем tooltip */
        .area:hover+.tooltip {
            display: block;
        }
    </style>

</head>



<body>
    {{ $image := .Resources.Get "1.jpeg" }}

    {{<figure src="./1.jpeg" title="title of image" width="1000">}}
        <div class="container"> <!-- Изображение, лежащее в той же папке, что и HTML -->
            <img src="1.jpeg" alt="Пример изображения">
            <img src="{{ $image.RelPermalink }}" alt="Пример изображения">
            <!-- Прямоугольная область с прозрачным зелёным фоном -->
            <div class="area"></div>

            <!-- Tooltip, появляющийся в фиксированных координатах при наведении на .area -->
            <div class="tooltip">
                Это tooltip, отображаемый при наведении на выделенную область.
            </div>
        </div>
</body>


</html>
